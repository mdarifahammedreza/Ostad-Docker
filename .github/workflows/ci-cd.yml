# CI/CD Workflow for front end only
# Build + lint + test the OstadUI app on every push/PR, then on main,
# SSH into the server via appleboy/ssh-action and reload it with PM2.

name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "OstadUI/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "OstadUI/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch: {}

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./OstadUI

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: OstadUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests (if configured)
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ostad-ui-dist
          path: OstadUI/dist
          retention-days: 3

  deploy:
    name: Deploy via PM2
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH and reload PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }} #ip address or domain of your server
          username: ${{ secrets.SSH_USERNAME }} #ec2-ubuntu or your server username
          key: ${{ secrets.SSH_PRIVATE_KEY }} # .pem private key for SSH authentication
          port: ${{ secrets.SSH_PORT || 22 }} # SSH port for the server
          script: |
            set -e
            APP_DIR=/home/arise/ostad/batch-14/Ostad-Docker
            REPO_URL="https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            cd OstadUI
            npm ci
            npm run build

            if pm2 describe ostad-ui > /dev/null 2>&1; then
              pm2 restart ostad-ui
            else
              pm2 serve dist 4173 --name ostad-ui --spa
            fi

            pm2 save
