services:
  server:
    build:
      context: .
      dockerfile: Dockerfile-server
    container_name: ostad-server
    ports:
      - "5050:5050"
    environment:
      MONGO_DB_USERNAME: ostad
      MONGO_DB_PASSWORD: ostad
    depends_on:
      - mongo
    networks:
      - ostad-net

  mongo:
    image: mongo:7
    container_name: ostad-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ostad
      MONGO_INITDB_ROOT_PASSWORD: ostad
    volumes:
      - mongo-data:/data/db
    networks:
      - ostad-net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ostad-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ostad
      ME_CONFIG_MONGODB_ADMINPASSWORD: ostad
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
    networks:
      - ostad-net

volumes:
  mongo-data:

networks:
  ostad-net:
    driver: bridge
